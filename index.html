
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raushani's Birthday Surprise</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;overflow:hidden;text-align:center;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#ffe0ef,#fff0c9,#e4e2ff);
 color:#9b3970;
}
h1{margin-top:45px;font-size:30px}
p{font-size:18px}
button{
 border:0;border-radius:25px;padding:14px 24px;
 background:#ff65a5;color:white;font-size:17px;
 cursor:pointer;margin:10px;
}
#sky{position:fixed;inset:0;pointer-events:none}
#giftArea{margin-top:55px;position:relative;z-index:2}
#gift{font-size:100px;cursor:pointer;display:inline-block;
 animation:bounce 1s infinite alternate}
@keyframes bounce{to{transform:translateY(-12px)}}
#message{
 display:none;font-size:25px;font-weight:bold;
 background:#fff9;padding:20px;border-radius:20px;
 margin:20px auto;max-width:90%;
 animation:appear .8s ease;
}
@keyframes appear{from{opacity:0;transform:scale(.5)}
to{opacity:1;transform:scale(1)}}
.balloon{
 position:absolute;bottom:-110px;width:58px;height:75px;
 border-radius:50%;cursor:pointer;pointer-events:auto;
 animation:rise 9s linear forwards;
 box-shadow:inset -8px -7px 0 #0002;
}
.balloon:after{
 content:"";position:absolute;bottom:-9px;left:24px;
 border-left:5px solid transparent;
 border-right:5px solid transparent;
 border-top:10px solid currentColor;
}
@keyframes rise{to{transform:translateY(-120vh) rotate(12deg)}}
.confetti{
 position:absolute;width:9px;height:14px;
 animation:burst 1.5s ease-out forwards;
}
@keyframes burst{
 to{transform:translate(var(--x),var(--y)) rotate(720deg);opacity:0}
}
.floating{
 position:absolute;bottom:-40px;
 animation:float 7s linear forwards;
}
.heart{font-size:25px}
.sparkle{font-size:22px}
@keyframes float{
 to{transform:translateY(-115vh) rotate(35deg);opacity:0}
}
</style>
</head>
<body>
<h1>🎀 A Little Surprise for You 🎀</h1>
<p>Someone special has a surprise for you! 💗</p>

<div id="giftArea">
 <div id="gift" onclick="openGift()">🎁</div>
 <p>Tap the gift to open your surprise!</p>
 <div id="message">
  🎂 Happy Birthday Raushani! 🎂
  <p>You are special! Keep smiling! ❤️</p>
  <button onclick="startBalloons()">Release Balloons 🎈</button>
 </div>
</div>

<div id="sky"></div>

<script>
const sky=document.getElementById("sky");
const colors=["#ff6fae","#8c82ff","#ffbd59","#69c9c1","#ff8290"];
let opened=false;

function openGift(){
 if(opened)return;
 opened=true;
 document.getElementById("gift").textContent="🎀";
 document.querySelector("#giftArea p").textContent="Surprise! 💖";
 document.getElementById("message").style.display="block";
 confettiBurst(innerWidth/2,innerHeight/2);
}

function confettiBurst(x,y){
 for(let i=0;i<35;i++){
  const c=document.createElement("div");
  c.className="confetti";
  c.style.background=colors[Math.floor(Math.random()*colors.length)];
  c.style.left=x+"px";c.style.top=y+"px";
  c.style.setProperty("--x",(Math.random()*240-120)+"px");
  c.style.setProperty("--y",(Math.random()*240-120)+"px");
  sky.appendChild(c);
  setTimeout(()=>c.remove(),1600);
 }
}

function popBalloon(b){
 const r=b.getBoundingClientRect();
 confettiBurst(r.left+25,r.top+30);
 b.remove();
}

function startBalloons(){
 for(let i=0;i<12;i++){
  const b=document.createElement("div");
  b.className="balloon";
  b.style.left=Math.random()*90+"vw";
  b.style.background=colors[Math.floor(Math.random()*colors.length)];
  b.style.color=b.style.background;
  b.style.animationDuration=(7+Math.random()*5)+"s";
  b.onclick=()=>popBalloon(b);
  sky.appendChild(b);
  setTimeout(()=>b.remove(),12500);
 }
}

function floatDecorations(){
 const symbols=["💖","💕","💗","✨","⭐","🌟"];
 const d=document.createElement("div");
 d.className="floating "+(Math.random()>.5?"heart":"sparkle");
 d.textContent=symbols[Math.floor(Math.random()*symbols.length)];
 d.style.left=Math.random()*95+"vw";
 d.style.animationDuration=(5+Math.random()*5)+"s";
 sky.appendChild(d);
 setTimeout(()=>d.remove(),11000);
}
setInterval(floatDecorations,600);
</script>
</body>
</html>
